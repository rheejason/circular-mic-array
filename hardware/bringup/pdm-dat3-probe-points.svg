<line x1="96.2" y1="108.6" x2="104" y2="121" stroke="#b5179e" stroke-width="0.3"/>
<circle cx="96.2" cy="108.6" r="1.0" fill="#b5179e"/>
<circle cx="104" cy="121" r="2.6" fill="#ffffff" stroke="#b5179e" stroke-width="0.5"/>
<text x="104" y="122.3" font-size="3.4" text-anchor="middle" font-weight="bold" fill="#b5179e">D</text>
<line x1="100.0" y1="110.2" x2="112" y2="116" stroke="#b5179e" stroke-width="0.3"/>
<circle cx="100.0" cy="110.2" r="1.0" fill="#b5179e"/>
<circle cx="112" cy="116" r="2.6" fill="#ffffff" stroke="#b5179e" stroke-width="0.5"/>
<text x="112" y="117.3" font-size="3.4" text-anchor="middle" font-weight="bold" fill="#b5179e">E</text>
<line x1="25" y1="180.0" x2="29.5" y2="180.0" stroke="#1f6fd1" stroke-width="0.9"/>
<text x="31" y="181.0" font-size="2.9" fill="#222">Blue: PDM_DAT3 on the front copper. Dashed: short hops on the back copper, between two vias.</text>
<text x="31" y="185.5" font-size="2.9" fill="#222">Route: ADAU7118 pin 6 → D/E vias → A (test point) → B/C vias → split → MK8 and MK7.</text>
<circle cx="27.3" cy="189.0" r="1.0" fill="#b5179e"/>
<text x="31" y="190.0" font-size="2.9" fill="#222">Pink A–E: probe points. A is the PDM_DAT3 test pad. B–E are vias (0.6 mm, covered by solder mask):</text>
<text x="31" y="194.5" font-size="2.9" fill="#222">press a needle tip into the small dimple in the middle of the via to reach copper.</text>
<text x="31" y="199.0" font-size="2.9" fill="#222"></text>
<text x="31" y="203.5" font-size="2.9" fill="#222">Board unpowered, meter on continuity (beep):</text>
<text x="31" y="208.0" font-size="2.9" fill="#222">   A to C beeps        → the line is intact from the test pad, through both vias, to the split.</text>
<text x="31" y="212.5" font-size="2.9" fill="#222">   A to B beeps, A to C silent → the back-copper hop between B and C is broken.</text>
<text x="31" y="217.0" font-size="2.9" fill="#222">   A to B silent       → break between the test pad and via B (front copper).</text>
<text x="31" y="221.5" font-size="2.9" fill="#222">   A to D and A to E   → the ADAU7118 side (only matters if a mic drives A to 0.9 V but indices stay 0).</text>
<text x="31" y="226.0" font-size="2.9" fill="#222"></text>
<text x="31" y="230.5" font-size="2.9" fill="#222">Board on: B, C, D, E should all read the same voltage as A.</text>
</svg>