<rect x="26" y="178.4" width="3" height="3" fill="#d62728"/>
<text x="31" y="181.0" font-size="3" fill="#222">Red line: the CLK1 trace (top copper, under the green solder mask). One chain:</text>
<text x="31" y="185.4" font-size="3" fill="#222">ADAU7118 pin 4 → TP8 → MK5 → MK6 → MK7 → MK8, about 50 mm between mics.</text>
<rect x="26" y="187.20000000000002" width="3" height="3" fill="#1f4fbf"/>
<text x="31" y="189.8" font-size="3" fill="#222">Blue dots 1–5: where to put the red meter probe. Each is on the trace just before a mic.</text>
<text x="31" y="194.2" font-size="3" fill="#222">Pierce the solder mask with a needle probe, or scrape a tiny spot.</text>
<text x="31" y="198.6" font-size="3" fill="#222">Setup: board unpowered. Supply + to TP8, − to a GND pad, 100 mA limit, 0.3 V max.</text>
<text x="31" y="203.0" font-size="3" fill="#222">Meter on DC mV, black probe on the same GND pad as the supply −.</text>
<text x="31" y="207.4" font-size="3" fill="#222"></text>
<text x="31" y="211.8" font-size="3" fill="#222">Reading: voltage falls ~12 mV from one dot to the next while current is still flowing.</text>
<text x="31" y="216.2" font-size="3" fill="#222">The short is at the last mic before the readings stop falling.</text>
<text x="31" y="220.6" font-size="3" fill="#222">   All of 2–5 fall, 5 lowest → MK8.   4 and 5 the same → MK7.   3, 4, 5 the same → MK6.</text>
<text x="31" y="225.0" font-size="3" fill="#222">   2–5 all the same → MK5.   2–5 all the same as 1 → ADAU7118 pin 4, not a mic.</text>
</svg>